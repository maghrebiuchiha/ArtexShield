[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "artex-shield"
version = "1.0.0"
description = "Layered detection and blocking for ARTEX-style automated penetration-testing traffic"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["security", "waf", "middleware", "wsgi", "asgi", "honeypot", "bot-detection"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Middleware",
]
dependencies = []

[project.scripts]
artex-shield-proxy = "artex_shield.proxy:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
artex_shield = ["py.typed"]
