# artex-shield-proxy settings (Python 3.11 or newer reads TOML).
#   artex-shield-proxy --config examples/proxy.toml
# Every key can also be set as ARTEX_SHIELD_<KEY> (upper case), which wins
# over this file; the command line's --backend, --listen and --mode win over both.

[proxy]
backend = "http://127.0.0.1:8000"   # the site; a bare origin, http or https
listen = "0.0.0.0:8080"             # also "[::]:8080", or a bare port
# backend_host_header = "preserve"  # pass the visitor's Host on; "backend" sends the backend's
# backend_tls_verify = true
# connect_timeout = 10.0            # seconds
# read_timeout = 60.0               # waiting on the backend, or on a visitor mid-request
# idle_timeout = 75.0               # a visitor's kept-alive connection between requests
# backend_idle_timeout = 4.0        # keep below the backend's own keep-alive timeout
# max_idle_backend = 32
# max_header_bytes = 65536
# access_log = false                # one line per request on stderr

[shield]
mode = "monitor"                    # "enforce" once the logs show no visitor you would have stopped
# Long random strings you keep: they decide the canary paths and the fake
# credentials. `artex-shield-proxy --print-decoys` prints what to plant.
# canary_secret = "..."
# honeytoken_secret = "..."
# client_check = true               # the optional client-side check; put its tag on every page
# client_check_secret = "..."
# trusted_proxies = ["10.0.0.0/8"]  # your TLS terminator or load balancer, if any
# allow_cidrs = []
# exempt_paths = ["/healthz"]
# Any other Config field works here too: throttle_score, block_score,
# half_life, block_ttl, rate_limit, tls_header, v6_escalate_after, ...

