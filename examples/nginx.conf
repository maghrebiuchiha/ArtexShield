# Enforce artex-shield blocks at the edge, before requests reach the app.
#
# In the app:  Config(blocklist_export_path="/etc/nginx/artex-deny.conf",
#                     trusted_proxies=["127.0.0.1/32"])
# Reload on change, for example:
#   while inotifywait -e close_write,moved_to /etc/nginx/; do nginx -s reload; done

server {
    listen 443 ssl;
    server_name example.com;

    include /etc/nginx/artex-deny.conf;      # lines like: deny 203.0.113.10;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        # Overwrite, never append: the app trusts this header from this proxy.
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
