# OpenResty for tests/edge.py: the edge module in front of a bare origin,
# with test hooks (tests/edge_hooks.lua) that set the vector's clock, report
# what the shield was asked and decided, and run the steps that are not
# requests. Never use this configuration for a site.
#
#   openresty -p /tmp/artex -c /srv/artex/tests/nginx/harness.conf
#   (the port's directory mounted at /srv/artex; listens on 127.0.0.1:8399)

worker_processes 1;
daemon off;
error_log stderr warn;
pid /tmp/artex-harness.pid;

events {
    worker_connections 256;
}

http {
    lua_shared_dict artex_shield 64m;
    lua_shared_dict artex_shield_blocks 8m;
    lua_shared_dict artex_test 4m;
    lua_package_path "/srv/artex/lib/?.lua;/srv/artex/tests/?.lua;;";
    access_log off;
    client_body_temp_path /tmp/artex-body;
    proxy_temp_path /tmp/artex-proxy;
    large_client_header_buffers 8 64k;
    client_max_body_size 1m;
    keepalive_requests 1000000;

    init_by_lua_block { require("edge_hooks").init() }

    upstream origin {
        server 127.0.0.1:8398;
        keepalive 4;
    }

    server {
        listen 127.0.0.1:8399;

        location = /__test/case   { access_by_lua_block { } content_by_lua_block { require("edge_hooks").case() } }
        location = /__test/step   { access_by_lua_block { } content_by_lua_block { require("edge_hooks").step() } }
        location = /__test/report { access_by_lua_block { } content_by_lua_block { require("edge_hooks").report() } }

        location / {
            access_by_lua_block { require("edge_hooks").access() }
            log_by_lua_block    { require("edge_hooks").log() }
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://origin;
        }
    }

    # The origin: answers with the status and Content-Type the harness asked for.
    server {
        listen 127.0.0.1:8398;
        default_type "";
        types { }                       # else nginx's built-in map types .html, .gif and .jpg itself
        location / {
            content_by_lua_block {
                ngx.req.discard_body()
                ngx.status = tonumber(ngx.var.http_x_test_status) or 200
                local ctype = ngx.var.http_x_test_type
                if ctype and ctype ~= "" then
                    ngx.header["Content-Type"] = ctype
                end
                ngx.header["Content-Length"] = 0
                ngx.send_headers()
                return ngx.exit(ngx.HTTP_OK)
            }
        }
    }
}
