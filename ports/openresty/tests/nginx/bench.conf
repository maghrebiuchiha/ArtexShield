# What the shield adds to a request through nginx: one worker proxying to an
# origin that answers 1 KiB, on 127.0.0.1:8599 with the shield and on :8597
# without it. Drive it with wrk and tests/nginx/visitors.lua (README.md,
# "What it costs").
#
#   openresty -p /tmp/artex-bench -c /srv/artex/tests/nginx/bench.conf

worker_processes 1;
daemon off;
error_log stderr error;
pid /tmp/artex-bench.pid;

events {
    worker_connections 1024;
}

http {
    lua_shared_dict artex_shield 64m;
    lua_shared_dict artex_shield_blocks 8m;
    lua_package_path "/srv/artex/lib/?.lua;;";
    access_log off;

    init_by_lua_block {
        require("resty.artex_shield").configure({mode = "enforce", trusted_proxies = {"127.0.0.1/32"},
            on_event = function() end})
    }

    upstream origin {
        server 127.0.0.1:8598;
        keepalive 32;
    }

    server {
        listen 127.0.0.1:8599;
        access_by_lua_block { require("resty.artex_shield").access() }
        log_by_lua_block    { require("resty.artex_shield").log() }
        location / {
            proxy_pass http://origin;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }

    server {
        listen 127.0.0.1:8597;
        location / {
            proxy_pass http://origin;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }

    server {
        listen 127.0.0.1:8598;
        location / {
            default_type text/html;
            return 200 "<html><body>....................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................</body></html>";
        }
    }
}
