# OpenResty for tests/smoke.py: the edge module as a site would run it, with
# four workers in enforce mode, in front of an origin that counts what reaches
# it. Events also go to a shared list the test reads (/__events).
#
#   openresty -p /tmp/artex-smoke -c /srv/artex/tests/nginx/smoke.conf
#   (the port's directory mounted at /srv/artex; listens on 127.0.0.1:8499)

worker_processes 4;
daemon off;
error_log stderr warn;
pid /tmp/artex-smoke.pid;

events {
    worker_connections 512;
}

http {
    lua_shared_dict artex_shield 16m;
    lua_shared_dict artex_shield_blocks 4m;
    lua_shared_dict artex_events 4m;
    lua_shared_dict origin_seen 1m;
    lua_package_path "/srv/artex/lib/?.lua;/srv/artex/tests/?.lua;;";
    access_log off;
    client_body_buffer_size 16k;              # a bigger body goes to a temporary file
    large_client_header_buffers 8 64k;        # room for the 30 KB header and URL in smoke.py
    client_max_body_size 4m;
    client_body_temp_path /tmp/artex-smoke-body;
    proxy_temp_path /tmp/artex-smoke-proxy;

    init_by_lua_block {
        local cjson = require("cjson.safe").new()
        require("resty.artex_shield").configure({
            mode = "enforce",
            trusted_proxies = {"127.0.0.1/32"},
            throttle_score = 60,                 -- so one payload (50) passes, and a second would not
            enum_404_threshold = 5,
            canary_secret = "smoke-canary-secret",
            honeytoken_secret = "smoke-honeytoken-secret",
            honeytokens = {"api_live_smoke0123456789"},
            client_check = true,
            client_check_secret = "smoke-client-check-secret",
            admin_token = "smoke-admin-token-0123456789",
            on_event = function(event)
                ngx.shared.artex_events:rpush("events", cjson.encode(event))
                if event.ip == "203.0.113.70" and ngx.get_phase() == "access" then
                    -- Widen the moment a decision takes, holding the client's lock, so that
                    -- another worker deciding on the same client would read the old score
                    -- unless the lock makes it wait (smoke.py: "at once").
                    ngx.sleep(0.02)
                end
            end,
        })
    }

    upstream origin {
        server 127.0.0.1:8498;
        keepalive 8;
    }

    server {
        listen 127.0.0.1:8499 reuseport;
        root /nonexistent;

        access_by_lua_block { require("resty.artex_shield").access() }
        log_by_lua_block    { require("resty.artex_shield").log() }
        header_filter_by_lua_block { ngx.header["X-Worker"] = ngx.worker.pid() }

        location / {
            proxy_pass http://origin;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;   # for the origin's counts only
        }

        # Internal redirects: the request must be decided on once.
        location /named/ { try_files $uri @app; }
        location /uri/   { try_files $uri /app$uri; }
        location @app    { proxy_pass http://origin; proxy_set_header X-Forwarded-For $http_x_forwarded_for; }
        location /app/   { internal; proxy_pass http://origin; proxy_set_header X-Forwarded-For $http_x_forwarded_for; }

        location = /_artex/admin {
            allow 127.0.0.1;
            deny all;
            content_by_lua_block { require("resty.artex_shield").admin() }
        }

        # Every pattern on the hostile 30 KB inputs, here with the JIT stack configure() set.
        location = /__patterns {
            access_by_lua_block { }
            content_by_lua_block {
                ngx.header["Content-Type"] = "application/json"
                ngx.print(require("cjson.safe").encode(require("patterns_matrix").run(0.25)))
            }
        }

        location = /__events {
            access_by_lua_block { }
            content_by_lua_block {
                local out, d = {}, ngx.shared.artex_events
                while true do
                    local e = d:lpop("events")
                    if not e then break end
                    out[#out + 1] = e
                end
                ngx.header["Content-Type"] = "application/json"
                ngx.print("[" .. table.concat(out, ",") .. "]")
            }
        }
    }

    # The origin: 404 for any path with /missing in it, an HTML page anywhere else; counts each request by X-Forwarded-For.
    server {
        listen 127.0.0.1:8498;
        location = /__origin/seen {
            content_by_lua_block { ngx.print(ngx.shared.origin_seen:get(ngx.var.arg_ip or "") or 0) }
        }
        location / {
            content_by_lua_block {
                ngx.req.discard_body()
                ngx.shared.origin_seen:incr(ngx.var.http_x_forwarded_for or "-", 1, 0)
                if ngx.var.uri:find("/missing", 1, true) then
                    ngx.status = 404
                    ngx.header["Content-Type"] = "text/html"
                    ngx.print("<h1>Not found</h1>")
                    return
                end
                ngx.header["Content-Type"] = "text/html; charset=utf-8"
                ngx.print("<html><body>page</body></html>")
            }
        }
    }
}
