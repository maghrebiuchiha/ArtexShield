# A static site served by OpenResty, with artex-shield deciding on every
# request before a file is sent. nginx's own 404s for missing files are fed
# back to the shield, so a client guessing paths is scored as it would be in
# front of an app.
#
# The library is ports/openresty/lib, here at /opt/artex-shield/lib, and
# settings come from the environment (artex_settings.lua). The site's files
# are in /var/www/site. Install this as nginx.conf, next to mime.types.

worker_processes auto;
error_log logs/error.log warn;               # the shield's events are logged at warn, one JSON line each

env ARTEX_SHIELD_MODE;
env ARTEX_SHIELD_TRUSTED_PROXIES;
env ARTEX_SHIELD_CANARY_SECRET;
env ARTEX_SHIELD_HONEYTOKEN_SECRET;
env ARTEX_SHIELD_CLIENT_CHECK;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;

    lua_shared_dict artex_shield        64m;    # client scores, 256-512 bytes each
    lua_shared_dict artex_shield_blocks 16m;    # blocks and locks: 128 bytes a block
    lua_package_path "/opt/artex-shield/lib/?.lua;/opt/artex-shield/?.lua;;";

    init_by_lua_block {
        require("resty.artex_shield").configure(require("artex_settings").from_env())
    }

    server {
        listen 8080;
        root /var/www/site;

        access_by_lua_block { require("resty.artex_shield").access() }
        log_by_lua_block    { require("resty.artex_shield").log() }

        location / {
            try_files $uri $uri/ =404;
        }

        # For health checks: answered before the access phase, so never scored.
        location = /_artex/health {
            access_log off;
            return 204;
        }
    }
}
