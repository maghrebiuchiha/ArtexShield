# OpenResty in front of any website: artex-shield decides on every request in
# the access phase, so a scanner it blocks never reaches the site behind.
# Scores and blocks live in shared memory, the same for every worker.
#
# The library is ports/openresty/lib, here mounted at /opt/artex-shield/lib.
# Settings come from the environment (artex_settings.lua); point the
# upstream at your site.

worker_processes auto;
error_log logs/error.log warn;               # the shield's events are logged at warn, one JSON line each

env ARTEX_SHIELD_MODE;
env ARTEX_SHIELD_TRUSTED_PROXIES;
env ARTEX_SHIELD_CANARY_SECRET;
env ARTEX_SHIELD_HONEYTOKEN_SECRET;
env ARTEX_SHIELD_CLIENT_CHECK;
env ARTEX_SHIELD_ADMIN_TOKEN;

events {
    worker_connections 1024;
}

http {
    lua_shared_dict artex_shield        64m;    # client scores, 256-512 bytes each; the least recently seen go first
    lua_shared_dict artex_shield_blocks 16m;    # blocks and locks: 128 bytes a block, room for max_blocks (100,000)
    lua_package_path "/opt/artex-shield/lib/?.lua;/opt/artex-shield/?.lua;;";

    init_by_lua_block {
        require("resty.artex_shield").configure(require("artex_settings").from_env())
    }

    upstream site {
        server wordpress:80;                     # your site
        keepalive 16;
    }

    server {
        listen 8080;
        client_max_body_size 64m;

        # Every location below inherits these two. A location with its own
        # access_by_lua must call require("resty.artex_shield").access() first.
        access_by_lua_block { require("resty.artex_shield").access() }
        log_by_lua_block    { require("resty.artex_shield").log() }

        location / {
            proxy_pass http://site;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            # Overwrite, never append, when nginx faces the visitors itself.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # For health checks: answered before the access phase, so never scored.
        location = /_artex/health {
            access_log off;
            return 204;
        }
    }

    # Active blocks as JSON (GET), and unblocking (POST ip=...): on a port of
    # its own, bound to loopback, never on the public server. Behind a TLS
    # terminator or another proxy on this host, every visitor reaches 8080
    # from 127.0.0.1, so "allow 127.0.0.1" there would let them all in. With
    # ARTEX_SHIELD_ADMIN_TOKEN set, it also wants "Authorization: Bearer <token>".
    #   curl -H "Authorization: Bearer $ARTEX_SHIELD_ADMIN_TOKEN" http://127.0.0.1:8081/_artex/admin
    server {
        listen 127.0.0.1:8081;

        location = /_artex/admin {
            content_by_lua_block { require("resty.artex_shield").admin() }
        }

        location / {
            return 404;
        }
    }
}
